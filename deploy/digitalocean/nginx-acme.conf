# Temporary HTTP-only bootstrap for ACME HTTP-01 validation.
# Unknown hosts are closed and the app is never served before HTTPS is ready.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}
