# Serve the app on the canonical apex; www redirects to the apex.
# Requires the Certbot certificate for downtimeos.tech and www.downtimeos.tech.
server {
    listen 80;
    listen [::]:80;
    server_name downtimeos.tech www.downtimeos.tech;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://downtimeos.tech$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name downtimeos.tech www.downtimeos.tech;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/downtimeos-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downtimeos-web/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DowntimeOS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    client_max_body_size 10m;

    location / {
        if ($host = www.downtimeos.tech) {
            return 301 https://downtimeos.tech$request_uri;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $downtimeos_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
