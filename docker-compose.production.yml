services:
  downtimeos:
    image: ${DOWNTIMEOS_IMAGE:?Define DOWNTIMEOS_IMAGE con una etiqueta inmutable}
    env_file:
      - path: /etc/downtimeos/production.env
        required: true
    environment:
      APP_ENV: production
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=48m,noexec,nosuid
      - /app/.next/cache:size=32m,uid=1001,gid=1001,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    mem_limit: ${DOWNTIMEOS_MEMORY_LIMIT:-768m}
    cpus: ${DOWNTIMEOS_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
