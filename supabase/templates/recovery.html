<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablece tu contraseña</title>
  </head>
  <body style="margin:0;background:#080b10;color:#e7edf5;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#080b10;padding:32px 12px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#10151d;border:1px solid #293543;border-radius:14px;">
          <tr><td style="padding:32px;">
            <p style="margin:0 0 24px;color:#f5b52e;font-size:14px;font-weight:700;letter-spacing:3px;">DOWNTIMEOS</p>
            <h1 style="margin:0 0 16px;font-size:26px;line-height:1.2;">Restablece tu contraseña</h1>
            <p style="margin:0 0 24px;color:#b7c2d1;font-size:16px;line-height:1.6;">Recibimos una solicitud para recuperar el acceso a tu cuenta. Usa este enlace seguro para elegir una contraseña nueva.</p>
            <p style="margin:0 0 24px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;border-radius:8px;background:#ffb629;color:#101010;font-size:16px;font-weight:700;text-decoration:none;">Crear nueva contraseña</a>
            </p>
            <p style="margin:0;color:#8996a8;font-size:13px;line-height:1.5;">Si no solicitaste recuperar tu acceso, ignora este mensaje. Tu contraseña no cambiará sin completar el enlace.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
