name: Despliegue controlado en DigitalOcean

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: SHA completo de main que pasó CI y publicó la imagen
        required: true
        type: string
      image_digest:
        description: Digest inmutable sha256 publicado en el resumen del workflow de imagen
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Desplegar a producción (requiere aprobación)
    if: github.ref == 'refs/heads/main'
    # SSH is intentionally allowlisted to the owner's workstation. Keep this
    # deployment on an ephemeral runner container launched from that trusted
    # machine instead of opening port 22 to GitHub's shared runner ranges.
    runs-on: [self-hosted, linux, x64, downtimeos-deploy]
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validar etiqueta de imagen
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EVENT_COMMIT: ${{ github.sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ || "$SOURCE_COMMIT" != "$EVENT_COMMIT" ]]; then
            echo "El despliegue debe ejecutarse desde el commit actual de main."
            exit 1
          fi
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Usa el digest sha256 publicado por container.yml."
            exit 1
          fi

      - name: Desplegar por SSH con verificación de host
        env:
          DEPLOY_HOST: ${{ secrets.DO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DO_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DO_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DO_DEPLOY_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Falta configurar el secreto $name en el environment production."
              exit 1
            fi
          done
          if [ -z "$GHCR_TOKEN" ]; then
            echo "GitHub no proporcionó un token temporal de solo lectura para GHCR."
            exit 1
          fi
          if ! [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "El nombre de usuario de GitHub no tiene un formato válido."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          key_file="$HOME/.ssh/deploy_key"
          known_hosts_file="$HOME/.ssh/known_hosts"
          cleanup() {
            rm -f -- "$key_file" "$known_hosts_file"
            unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS GHCR_TOKEN
          }
          trap cleanup EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"

          printf '%s\n' "$GHCR_TOKEN" | ssh -i "$key_file" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/downtimeos-deploy '$SOURCE_COMMIT' '$IMAGE_DIGEST' '$GHCR_USERNAME'"
