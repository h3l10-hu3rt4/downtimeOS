services:
  downtimeos:
    build: .
    environment:
      # Lista explícita: no importar .env.local, que puede contener llaves reales
      # de Meta, Twilio, Resend o proveedores de IA. Las integraciones son opt-in
      # mediante variables DOWNTIMEOS_LOCAL_* y permanecen apagadas por defecto.
      APP_ENV: ${DOWNTIMEOS_APP_ENV:-development}
      APP_URL: ${DOWNTIMEOS_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${DOWNTIMEOS_APP_URL:-http://localhost:3000}
      SUPABASE_URL: ${DOWNTIMEOS_LOCAL_SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_SECRET_KEY: ${DOWNTIMEOS_LOCAL_SUPABASE_SECRET_KEY:?Usa scripts/docker-local.ps1 para apuntar al Supabase Local}
      SUPABASE_SERVICE_ROLE_KEY: ${DOWNTIMEOS_LOCAL_SUPABASE_SECRET_KEY:?Usa scripts/docker-local.ps1 para apuntar al Supabase Local}
      SUPABASE_PUBLISHABLE_KEY: ${DOWNTIMEOS_LOCAL_SUPABASE_PUBLISHABLE_KEY:?Usa scripts/docker-local.ps1 para apuntar al Supabase Local}
      SUPABASE_ANON_KEY: ${DOWNTIMEOS_LOCAL_SUPABASE_PUBLISHABLE_KEY:?Usa scripts/docker-local.ps1 para apuntar al Supabase Local}
      NEXT_PUBLIC_SUPABASE_URL: ${DOWNTIMEOS_LOCAL_SUPABASE_BROWSER_URL:-http://localhost:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${DOWNTIMEOS_LOCAL_SUPABASE_PUBLISHABLE_KEY:?Usa scripts/docker-local.ps1 para apuntar al Supabase Local}
      REGLA_B2B_ACTIVA: ${DOWNTIMEOS_LOCAL_REGLA_B2B_ACTIVA:-true}
      DASHBOARD_ADMIN_EMAIL: ${DOWNTIMEOS_LOCAL_DASHBOARD_ADMIN_EMAIL:-}
      DASHBOARD_ADMIN_PASSWORD: ${DOWNTIMEOS_LOCAL_DASHBOARD_ADMIN_PASSWORD:-}
      WHATSAPP_PROVIDER: ${DOWNTIMEOS_LOCAL_WHATSAPP_PROVIDER:-meta}
      WHATSAPP_ALERTAS_ACTIVAS: ${DOWNTIMEOS_LOCAL_WHATSAPP_ALERTAS_ACTIVAS:-false}
      WHATSAPP_APROBACIONES_ACTIVAS: ${DOWNTIMEOS_LOCAL_WHATSAPP_APROBACIONES_ACTIVAS:-false}
      WHATSAPP_META_USE_TEMPLATES: ${DOWNTIMEOS_LOCAL_WHATSAPP_META_USE_TEMPLATES:-false}
      WHATSAPP_ALERTAS_DESTINATARIOS: ${DOWNTIMEOS_LOCAL_WHATSAPP_ALERTAS_DESTINATARIOS:-}
      WHATSAPP_OPERACIONES_DESTINATARIO: ${DOWNTIMEOS_LOCAL_WHATSAPP_OPERACIONES_DESTINATARIO:-}
      WHATSAPP_FINANZAS_DESTINATARIO: ${DOWNTIMEOS_LOCAL_WHATSAPP_FINANZAS_DESTINATARIO:-}
      META_WHATSAPP_ACCESS_TOKEN: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_ACCESS_TOKEN:-}
      META_WHATSAPP_PHONE_NUMBER_ID: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_PHONE_NUMBER_ID:-}
      META_WHATSAPP_VERIFY_TOKEN: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_VERIFY_TOKEN:-}
      META_WHATSAPP_APP_SECRET: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_APP_SECRET:-}
      META_WHATSAPP_WEBHOOK_SECRET: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_WEBHOOK_SECRET:-}
      META_WHATSAPP_GRAPH_VERSION: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_GRAPH_VERSION:-v23.0}
      META_WHATSAPP_TEMPLATE_LANGUAGE: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_TEMPLATE_LANGUAGE:-es_MX}
      META_WHATSAPP_TEMPLATE_PAROS: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_TEMPLATE_PAROS:-downtimeos_alerta_paros}
      META_WHATSAPP_TEMPLATE_ALERTA_ACTIVO: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_TEMPLATE_ALERTA_ACTIVO:-downtimeos_alerta_activo}
      META_WHATSAPP_TEMPLATE_REPORTE: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_TEMPLATE_REPORTE:-downtimeos_reporte_ejecutivo}
      META_WHATSAPP_TEMPLATE_APROBACION: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_TEMPLATE_APROBACION:-downtimeos_validacion_paro}
      META_WHATSAPP_TEMPLATE_PAROS_LANGUAGE: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_TEMPLATE_PAROS_LANGUAGE:-es_MX}
      META_WHATSAPP_TEMPLATE_ALERTA_ACTIVO_LANGUAGE: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_TEMPLATE_ALERTA_ACTIVO_LANGUAGE:-en}
      META_WHATSAPP_TEMPLATE_REPORTE_LANGUAGE: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_TEMPLATE_REPORTE_LANGUAGE:-en}
      META_WHATSAPP_TEMPLATE_APROBACION_LANGUAGE: ${DOWNTIMEOS_LOCAL_META_WHATSAPP_TEMPLATE_APROBACION_LANGUAGE:-en}
      TWILIO_ACCOUNT_SID: ${DOWNTIMEOS_LOCAL_TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${DOWNTIMEOS_LOCAL_TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${DOWNTIMEOS_LOCAL_TWILIO_WHATSAPP_FROM:-}
      GEMINI_API_KEY: ${DOWNTIMEOS_LOCAL_GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${DOWNTIMEOS_LOCAL_ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${DOWNTIMEOS_LOCAL_GEMINI_MODEL:-gemini-3.1-flash-lite}
      ANTHROPIC_MODEL: ${DOWNTIMEOS_LOCAL_ANTHROPIC_MODEL:-claude-sonnet-5}
      AI_FINANZAS_PROVIDER: ${DOWNTIMEOS_LOCAL_AI_FINANZAS_PROVIDER:-gemini}
      AI_OPERACIONES_PROVIDER: ${DOWNTIMEOS_LOCAL_AI_OPERACIONES_PROVIDER:-gemini}
      AI_REPORTE_FALLBACK_PROVIDER: ${DOWNTIMEOS_LOCAL_AI_REPORTE_FALLBACK_PROVIDER:-}
      CRON_SECRET: ${DOWNTIMEOS_LOCAL_CRON_SECRET:-}
      RESEND_API_KEY: ${DOWNTIMEOS_LOCAL_RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${DOWNTIMEOS_LOCAL_RESEND_FROM_EMAIL:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
